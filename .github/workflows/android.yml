name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with: { java-version: '17', distribution: 'temurin' }
    - name: Install Android SDK packages
      run: |
        SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
        test -n "$SDKMANAGER"
        yes | "$SDKMANAGER" --licenses
        "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
    - name: Build Release and Debug APKs
      run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with: { name: nox-android-apk, path: app/build/outputs/apk/release/app-release-unsigned.apk }
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with: { name: nox-android-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
